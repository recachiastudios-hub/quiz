// A rough fingerprint of the phone, sent so the teacher can be warned about retakes
async function deviceInfo() {
  try {
    const ua = navigator.userAgent || '';
    const platform = /iPhone|iPad|iPod/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : 'Other';
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(Math.min(screen.width, screen.height) * dpr / 20) * 20;
    const h = Math.round(Math.max(screen.width, screen.height) * dpr / 20) * 20;
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    let model = '';
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        const v = await navigator.userAgentData.getHighEntropyValues(['model']);
        model = (v && v.model) ? String(v.model).slice(0, 40) : '';
      }
    } catch (e) {}
    const src = [platform, w + 'x' + h, tz].join('|');
    return { sig: hashStr(src) + hashStr(src.split('').reverse().join('')), label: platform + (model ? ' ' + model : '') + ' · ' + w + '×' + h };
  } catch (e) {
    return { sig: '', label: '' };
  }
}

// Asks the server to let this name start. Returns { ok, claimed?, name?, reason? }.
async function claimAttempt(name, pick) {
  if (previewMode || !quizId || !SHORT_API) return { ok: true, claimed: false };
  if (!attemptToken) attemptToken = newQuizId() + newQuizId();
  const dev = await deviceInfo();
  try {
    const r = await apiPost('/start', {
      id: quizId, name, token: attemptToken, sig: dev.sig, label: dev.label, lim: quizTime || 0, pick: pick || ''
    }, 8000);
    if (r.status === 409) return { ok: false, reason: 'taken' };
    if (r.status === 422) {
      let why = '';
      try { why = (await r.json()).error; } catch (e) {}
      return { ok: false, reason: why === 'ambiguous' ? 'ambiguous' : 'nomatch' };
    }
    if (r.status === 404 || r.status === 405) return { ok: true, claimed: false };
    if (!r.ok) return { ok: false, reason: 'server' };
    let d = {};
    try { d = await r.json(); } catch (e) {}
    if (d && d.status === 'confirm' && typeof d.name === 'string') return { ok: false, reason: 'confirm', name: d.name };
    return { ok: true, claimed: true, name: (d && typeof d.name === 'string') ? d.name : '' };
  } catch (e) {
    return { ok: false, reason: 'network' };
  }
}

// Did the teacher give this name another try?
async function wasReset(name) {
  if (!quizId || !SHORT_API) return false;
  try {
    const r = await apiPost('/status', { id: quizId, name }, 6000);
    if (!r.ok) return false;
    const d = await r.json();
    return !!(d && d.reset === true);
  } catch (e) {
    return false;
  }
}

const START_ERRORS = {
  taken: "This name has already started this quiz, so it can't be taken again. If this is a mistake (for example your phone switched off), tell your teacher.",
  nomatch: "We couldn't find that name on your teacher's list. Check the spelling and try again. If it still doesn't work, tell your teacher.",
  ambiguous: 'That name is close to more than one name on the list. Type your full name exactly as your teacher wrote it, or tell your teacher.',
  other: 'Could not reach the server. Check your internet connection and tap Start Quiz again.'
};

async function beginQuiz(pick) {
  const nameEl = $('studentName');
  const btn = $('startBtn');
  if (btn && btn.disabled) return;
  const typed = nameEl ? nameEl.value.trim() : '';
  const n = (typeof pick === 'string' && pick) ? pick : typed;
  if (!n) { markInvalid(nameEl); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  showMsg('', 'startMsg');
  const box = $('confirmBox');
  if (box) box.innerHTML = '';

  const claim = await claimAttempt(n, (typeof pick === 'string') ? pick : '');

  if (!claim.ok) {
    if (btn) { btn.disabled = false; btn.textContent = 'Start Quiz →'; }
    if (claim.reason === 'confirm') {
      // The server found a close match on the class list: ask "Are you …?"
      pendingPick = claim.name;
      if (box) box.innerHTML = `
        <div class="info-box">Are you <strong dir="auto">${esc(claim.name)}</strong>?</div>
        <button class="btn" onclick="beginQuiz(pendingPick)">Yes, start</button>
        <button class="btn btn-outline" onclick="cancelConfirm()">No, change my name</button>`;
      return;
    }
    showMsg(START_ERRORS[claim.reason] || START_ERRORS.other, 'startMsg');
    return;
  }

  takerName = claim.name || n;
  claimedOnServer = !!claim.claimed;
  takerStarted = true;
  timerStart = Date.now();
  saveProgress();
  renderTakerQ();
  startTimerTick();
}

function cancelConfirm() {
  pendingPick = '';
  const box = $('confirmBox');
  if (box) box.innerHTML = '';
  const nameEl = $('studentName');
  if (nameEl) { nameEl.focus(); nameEl.select(); }
}

// ── Saved progress on this device (one attempt per device, survives a refresh) ──
const progressKey = () => quizId ? 'qb1:' + quizId : '';

function saveProgress() {
  if (previewMode || !progressKey()) return;
  lsSet(progressKey(), JSON.stringify({
    n: takerName,
    g: answerMap.map(a => a ? a.given : null),
    o: queue.slice(),
    s: timerStart,
    f: fullOrder,
    p: perms,
    r: resultSubmitted,
    k: claimedOnServer ? 1 : 0,
    i: mySid
  }));
}

function loadProgress() {
  if (!progressKey()) return null;
  try {
    const p = JSON.parse(lsGet(progressKey()) || 'null');
    if (p && typeof p.n === 'string' && p.n && Array.isArray(p.g) && p.g.length <= quizData.length &&
        p.g.every(x => x === null || typeof x === 'string')) return p;
  } catch (e) {}
  return null;
}

// Rebuilds the attempt from saved progress after a refresh.
function restoreAttempt(saved) {
  restored = true;
  claimedOnServer = saved.k === 1;
  mySid = (typeof saved.i === 'string' && /^[a-z0-9]{4,12}$/.test(saved.i)) ? saved.i : '';
  takerName = saved.n;
  takerStarted = true;
  timerStart = (typeof saved.s === 'number' && saved.s > 0) ? saved.s : Date.now();

  initQueue();
  fullOrder = isPerm(saved.f, quizData.length) ? saved.f.slice() : range(quizData.length);
  perms = quizData.map((q, i) => {
    const n = q.type === 'mc' ? 4 : q.type === 'cc' ? q.choices.length : 0;
    if (!n) return null;
    return (Array.isArray(saved.p) && isPerm(saved.p[i], n)) ? saved.p[i].slice() : range(n);
  });

  quizData.forEach((q, i) => {
    const given = saved.g[i];
    if (typeof given !== 'string') return;
    if (q.type === 'wr') {
      // Empty = time ran out with no answer; otherwise wait for the teacher (the poll fills the mark in)
      answerMap[i] = { question: q.text, given, correct: '', right: given === '' ? false : null, written: true, noAns: given === '' };
    } else {
      const correct = correctKey(q);
      answerMap[i] = { question: q.text, given, correct, right: given === correct };
    }
  });

  const remaining = range(quizData.length).filter(i => !answerMap[i]);
  const order = Array.isArray(saved.o) ? saved.o.filter(i => Number.isInteger(i) && remaining.includes(i)) : [];
  remaining.forEach(i => { if (!order.includes(i)) order.push(i); });
  queue = order;

  if (queue.length === 0) {
    resultSubmitted = saved.r === true;
    finishQuiz();
  } else if (quizTime && Date.now() - timerStart >= quizTime * 1000) {
    timeUp();
  } else {
    renderTakerQ();
    startTimerTick();
  }
}


/* ── 11. TAKER: QUESTIONS & ANSWERS ─────────────────────── */
function renderTakerQ() {
  takerBusy = false;
  ccSelected = new Set();
  if (quizLocked) { renderLocked(); return; }

  const idx = queue[0];
  const q = quizData[idx];
  const total = quizData.length;
  const pct = Math.round(((total - queue.length) / total) * 100);
  const options = { mc: mcOptionsHtml, tf: tfOptionsHtml, cc: ccOptionsHtml, wr: wrInputHtml }[q.type](q, idx);
  const heading = q.photo
    ? `<div class="q-media"><div class="q-media-img"><img src="${photoUrl(q.photo)}" alt="" loading="lazy"></div><h2 dir="auto">${esc(q.text)}</h2></div>`
    : `<h2 dir="auto" style="margin-bottom:24px;">${esc(q.text)}</h2>`;

  $('takerContent').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-row">
      <div class="q-counter">Question ${fullOrder.indexOf(idx) + 1} of ${total} · ${TYPE_INFO[q.type].label}</div>
      ${quizTime ? '<div class="timer-pill" id="timerBox"></div>' : ''}
    </div>
    ${heading}
    ${options}
    ${queue.length > 1 ? '<div class="skip-row"><button class="btn btn-outline skip-btn" onclick="skipQuestion()">Skip for now</button></div>' : ''}`;
  if (quizTime) paintTimer(timeLeft());
}

function mcOptionsHtml(q, idx) {
  const pm = perms[idx] || range(4);
  return MC_LETTERS.map((l, i) => {
    const orig = MC_LETTERS[pm[i]];
    return `
      <div class="answer-option" data-orig="${orig}" onclick="selectAnswer('${orig}')">
        <span class="option-label">${l}</span>
        <span dir="auto">${esc(q.choices[pm[i]])}</span>
      </div>`;
  }).join('');
}

function tfOptionsHtml() {
  return `<div class="tf-options">
    <button class="tf-btn" onclick="selectAnswer('True')">True</button>
    <button class="tf-btn" onclick="selectAnswer('False')">False</button>
  </div>`;
}

function ccOptionsHtml(q, idx) {
  const pm = perms[idx] || range(q.choices.length);
  const hint = q.answers.length > 1
    ? `Select <strong>all</strong> correct answers (${q.answers.length} total), then tap Confirm.`
    : 'Select the correct answer, then tap Confirm.';
  return `<p class="hint">${hint}</p>` + pm.map((origIdx, disp) => `
      <div class="answer-option cc-multi" id="ccopt_${disp}" data-orig="${origIdx}" onclick="ccToggleTaker(${disp})">
        <span class="option-label">${CC_LETTERS[disp]}</span>
        <span dir="auto">${esc(q.choices[origIdx])}</span>
      </div>`).join('') +
    `<div class="cc-submit-row"><button class="btn" id="ccConfirmBtn" onclick="confirmCCAnswer()">Confirm Answer →</button></div>
     <div class="msg" id="msg"></div>`;
}

function wrInputHtml(q, idx) {
  return `<p class="hint">Type your answer below. Your teacher will mark it.</p>
    <textarea id="wrInp" dir="auto" rows="6" maxlength="${WR_MAX}" placeholder="Write your answer here…" oninput="wrDrafts[${idx}]=this.value">${esc(wrDrafts[idx] || '')}</textarea>
    <div class="cc-submit-row"><button class="btn" id="wrBtn" onclick="submitWritten()">Submit Answer →</button></div>
    <div class="msg" id="msg"></div>`;
}

// Stores the answer and takes the question off the queue.
function recordAnswer(idx, entry) {
  answerMap[idx] = entry;
  takerBusy = true;
  queue.shift();
  saveProgress();
}

// After a short pause (so the green/red flash can be seen): next question, or the result.
function advance(delay) {
  setTimeout(() => {
    if (timeIsUp) return;
    if (queue.length === 0) finishQuiz(); else renderTakerQ();
  }, delay);
}

function finishQuiz() {
  takerAnswers = answerMap.slice();
  quizLocked = true;
  renderResult();
}

// Multiple choice and true/false
function selectAnswer(val) {
  if (quizLocked || takerBusy) return;
  const idx = queue[0];
  const q = quizData[idx];
  const right = val === q.answer;
  recordAnswer(idx, { question: q.text, given: val, correct: q.answer, right });

  const isMc = q.type === 'mc';
  const cls = quizHideFlash ? 'selected' : (right ? 'correct' : 'wrong');
  document.querySelectorAll(isMc ? '.answer-option' : '.tf-btn').forEach(el => {
    const v = isMc ? el.dataset.orig : el.textContent;
    if (v === val) el.classList.add(cls);
    if (!quizHideFlash && v === q.answer && !right) el.classList.add('correct');
  });
  advance(quizHideFlash ? 400 : 800);
}

// Custom choice: tick any number of options, then Confirm
function ccToggleTaker(disp) {
  if (quizLocked || takerBusy) return;
  const el = $('ccopt_' + disp);
  if (!el) return;
  if (ccSelected.has(disp)) { ccSelected.delete(disp); el.classList.remove('selected'); }
  else { ccSelected.add(disp); el.classList.add('selected'); }
}

function confirmCCAnswer() {
  if (quizLocked || takerBusy) return;
  if (!ccSelected.size) { showMsg('Please select at least one answer.', 'msg'); return; }

  const idx = queue[0];
  const q = quizData[idx];
  const pm = perms[idx] || range(q.choices.length);
  const picked = [...ccSelected].map(d => pm[d]).sort((a, b) => a - b);   // back to the original choice numbers
  const given = picked.join(',');
  const correct = correctKey(q);
  recordAnswer(idx, { question: q.text, given, correct, right: given === correct });

  document.querySelectorAll('.answer-option.cc-multi').forEach(el => {
    const o = Number(el.dataset.orig);
    const isSel = picked.includes(o), isCorr = q.answers.includes(o);
    if (quizHideFlash) { if (isSel) el.classList.add('selected'); }
    else if (isSel && isCorr) el.classList.add('correct');
    else if (isSel) el.classList.add('wrong');
    else if (isCorr) el.classList.add('partial');
  });
  const btn = $('ccConfirmBtn');
  if (btn) btn.disabled = true;
  advance(quizHideFlash ? 400 : 900);
}

// Written: saved as "waiting for the teacher" (right = null)
function submitWritten() {
  if (quizLocked || takerBusy) return;
  const el = $('wrInp');
  const text = el ? el.value.trim().slice(0, WR_MAX) : '';
  if (!text) { showMsg('Please write an answer first.', 'msg'); return; }

  const idx = queue[0];
  recordAnswer(idx, { question: quizData[idx].text, given: text, correct: '', right: null, written: true });
  delete wrDrafts[idx];
  const btn = $('wrBtn');
  if (btn) btn.disabled = true;
  if (el) el.disabled = true;
  advance(300);
}

function skipQuestion() {
  if (quizLocked || takerBusy || queue.length < 2) return;
  const now = Date.now();
  if (now - lastSkipAt < 400) return;   // ignore double taps
  lastSkipAt = now;
  ccSelected = new Set();
  queue.push(queue.shift());
  saveProgress();
  renderTakerQ();
}


/* ── 12. TAKER: TIMER, RESULT, GRADING ──────────────────── */
function timeLeft() {
  return Math.max(0, Math.ceil((quizTime * 1000 - (Date.now() - timerStart)) / 1000));
}

function paintTimer(left) {
  const box = $('timerBox');
  if (!box) return;
  box.textContent = '⏱ ' + fmtClock(left);
  box.classList.toggle('low', left <= Math.min(60, Math.ceil(quizTime / 5)));
}

function timerTick() {
  const left = timeLeft();
  paintTimer(left);
  if (left <= 0) timeUp();
}

function startTimerTick() {
  stopTimer();
  if (quizTime) timerId = setInterval(timerTick, 1000);
}

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

// Time ran out: everything not answered counts as wrong.
function timeUp() {
  stopTimer();
  if (timeIsUp || quizLocked) return;
  timeIsUp = true;
  queue.forEach(i => {
    const q = quizData[i];
    answerMap[i] = q.type === 'wr'
      ? { question: q.text, given: '', correct: '', right: false, written: true, noAns: true }
      : { question: q.text, given: 'No answer', correct: correctKey(q), right: false };
  });
  queue = [];
  takerBusy = false;
  saveProgress();
  finishQuiz();
}

function renderResult() {
  stopTimer();
  paintResult();
  if (!previewMode) reportResult();
  startGradePoll();
}

// Draws the result screen. Called again whenever the teacher marks a written answer.
function paintResult() {
  const score = takerAnswers.filter(a => a.right === true).length;
  const pending = takerAnswers.filter(a => a.right === null).length;
  const total = takerAnswers.length;
  const pct = Math.round((score / total) * 100);
  const grade = pending ? 'So far' : gradeFor(pct);
  const timedOut = takerAnswers.some(a => a.given === 'No answer' || a.noAns);

  const rows = takerAnswers.map((a, i) => `
    <div class="breakdown-row">
      <span dir="auto">Q${i + 1}: ${esc(a.question.length > 40 ? a.question.slice(0, 40) + '…' : a.question)}</span>
      ${a.right === null
        ? '<span class="pending-tag">⏳ Waiting for teacher</span>'
        : `<span class="${a.right ? 'correct-tag' : 'wrong-tag'}">${a.right ? '✓ Correct' : '✗ Wrong'}</span>`}
    </div>`).join('');

  const statusText = previewMode ? '' : (resultSubmitted ? '✅ Your result has been sent to your teacher.' : '📤 Sending your result to your teacher…');
  const pendingNote = pending
    ? `<p class="wr-note">✍️ ${pending} written ${pending === 1 ? 'answer is' : 'answers are'} waiting for your teacher to mark ${pending === 1 ? 'it' : 'them'}.${previewMode ? ' (In a real quiz you mark these in Live Results.)' : ' Keep this page open — your score updates here by itself.'}</p>`
    : '';

  $('takerContent').innerHTML = `
    <div class="result-name" dir="auto">${esc(takerName)}</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">© Youssef Hisham 2026</div>
    <div class="result-score">${score}/${total}</div>
    <div class="result-label">${grade} · ${pct}%</div>
    ${pendingNote}
    ${timedOut ? '<p class="time-note">⏰ Time was up. Questions you didn\'t answer were marked wrong.</p>' : ''}
    <div class="result-breakdown">${rows}</div>
    <p class="screenshot-hint" id="resultMsg">${statusText}</p>
    <div class="home-btns">
      <button class="btn" onclick="closeQuiz()">${previewMode ? 'Exit Preview' : 'Close Quiz'}</button>
    </div>`;
}

// Sends the finished result to the teacher (one automatic retry).
async function reportResult() {
  if (previewMode || resultSubmitted || !quizId || reportingNow) return;
  reportingNow = true;
  const payload = {
    id: quizId,
    name: takerName,
    score: takerAnswers.filter(a => a.right === true).length,
    total: takerAnswers.length,
    breakdown: takerAnswers.map(a => a.written ? { q: a.question, w: true, a: a.given } : { q: a.question, r: a.right })
  };
  const trySend = async () => {
    try {
      const r = await apiPost('/submit-result', payload);
      if (!r.ok) return null;
      try { return await r.json(); } catch (e) { return {}; }
    } catch (e) { return null; }
  };

  let res = await trySend();
  if (!res) { await new Promise(resolve => setTimeout(resolve, 4000)); res = await trySend(); }
  reportingNow = false;

  const el = $('resultMsg');
  if (res) {
    resultSubmitted = true;
    if (typeof res.sid === 'string' && /^[a-z0-9]{4,12}$/.test(res.sid)) mySid = res.sid;
    saveProgress();
    if (el) el.textContent = '✅ Your result has been sent to your teacher.';
    startGradePoll();
  } else if (el) {
    el.textContent = '⚠️ Could not reach the server. Please tell your teacher your score directly: ' + payload.score + '/' + payload.total + '.';
  }
}

// While written answers are waiting, ask the server every few seconds whether the teacher marked them.
function startGradePoll() {
  stopGradePoll();
  if (previewMode || !quizId) return;
  if (!takerAnswers.some(a => a && a.right === null)) return;
  gradePollId = setInterval(pollMyGrades, 10000);
  if (mySid) pollMyGrades();
}

function stopGradePoll() {
  if (gradePollId) { clearInterval(gradePollId); gradePollId = null; }
}

async function pollMyGrades() {
  if (previewMode || !mySid || !quizId) return;
  try {
    const r = await apiPost('/my-grades', { id: quizId, sid: mySid });
    if (!r.ok) return;
    const d = await r.json();
    const g = (d && d.g && typeof d.g === 'object') ? d.g : {};
    let changed = false;
    quizData.forEach((q, i) => {
      const a = answerMap[i];
      if (q.type !== 'wr' || !a || !a.written || a.noAns) return;
      const next = g[i] === 1 ? true : g[i] === 0 ? false : null;
      if (a.right !== next) { a.right = next; changed = true; }
    });
    if (changed) {
      takerAnswers = answerMap.slice();
      if (quizLocked) paintResult();
    }
    if (!answerMap.some(a => a && a.right === null)) stopGradePoll();
  } catch (e) {}
}

function closeQuiz() {
  if (previewMode) exitPreview(); else renderLocked();
}

function renderLocked() {
  $('takerContent').innerHTML = `
    <div class="locked">
      <div class="locked-icon">🔒</div>
      <h2>Quiz Closed</h2>
      <p style="color:var(--muted);font-size:14px;margin-top:8px;">This quiz session has ended.<br>Please contact your teacher for a new session.</p>
    </div>`;
}


/* ── 13. LIVE RESULTS (TEACHER) ─────────────────────────── */
// ── Reopen a session with the 5-digit code ──
function openResume() {
  const box = $('resumeBox');
  if (box) box.style.display = 'block';
  showMsg('', 'homeMsg');
  const inp = $('resumeCode');
  if (inp) { inp.value = ''; inp.focus(); }
}

function closeResume() {
  const box = $('resumeBox');
  if (box) box.style.display = 'none';
  showMsg('', 'homeMsg');
}

async function resumeSession() {
  const inp = $('resumeCode');
  // Arabic-Indic digits (٠١٢٣٤٥٦٧٨٩) are accepted too
  const code = (inp ? inp.value : '').replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/\D/g, '');
  if (code.length !== 5) { showMsg('Type the 5-digit code from your save page.', 'homeMsg'); return; }
  showMsg('Opening…', 'homeMsg', true);
  try {
    const r = await apiPost('/resume', { code }, 8000);
    if (r.status === 429) { showMsg('Too many wrong codes. Please wait an hour and try again.', 'homeMsg'); return; }
    if (!r.ok) { showMsg("That code wasn't found. Check the 5 digits. Codes work for 30 days after the quiz is saved.", 'homeMsg'); return; }
    const d = await r.json();
    if (!d || !/^[a-z0-9]{4,20}$/i.test(d.id || '') || !/^[a-f0-9]{32}$/i.test(d.tk || '')) {
      showMsg('Something went wrong with that code. Try again.', 'homeMsg');
      return;
    }
    liveTkMem = d.tk.toLowerCase();
    lsSet('qb_tk:' + d.id, liveTkMem);
    lsSet('qb_code:' + d.id, code);
    if (typeof d.name === 'string' && d.name) lsSet('qb_name:' + d.id, d.name.slice(0, 60));
    try { history.replaceState(null, '', location.pathname + location.search + '#live=' + d.id); } catch (e) {}
    showMsg('', 'homeMsg');
    startLiveResults(d.id);
  } catch (e) {
    showMsg('Could not reach the server. Check your internet connection and try again.', 'homeMsg');
  }
}

const liveTeacherKey = () => liveTkMem || teacherKeyFor(liveQuizId);

function startLiveResults(id) {
  liveQuizId = id;
  liveSig = '';
  show('live');
  const c = codeFor(id);
  setLiveName(nameFor(id));
  $('liveCode').textContent = c ? '🔑 Session code: ' + c : '';
  renderLiveResults([]);
  pollLiveResults();
  if (livePollId) clearInterval(livePollId);
  livePollId = setInterval(pollLiveResults, 3000);
}

async function pollLiveResults() {
  if (!liveQuizId || document.hidden) return;      // no need to ask the server while the tab is in the background
  if (roomOpen) pollRoom();
  if (livePolling) return;                         // the last request is still running
  livePolling = true;
  const startedAt = Date.now();
  try {
    let d = null;
    const tk = liveTeacherKey();
    if (tk && !liveViewOnly) {
      // Teacher: also gets the written answers and can mark them
      const r = await apiPost('/review', { id: liveQuizId, tk }, 10000);
      if (r.status === 403) liveViewOnly = true;
      else if (r.ok) d = await r.json();
    }
    if (!d) {
      const r = await apiFetch(SHORT_API + '/results?id=' + encodeURIComponent(liveQuizId), {}, 10000);
      if (!r.ok) return;
      d = await r.json();
    }
    if (d && typeof d.session === 'string' && d.session) {
      setLiveName(d.session);
      lsSet('qb_name:' + liveQuizId, d.session);
    }
    // Don't let an old reply undo a mark the teacher just made
    if (gradeBusy > 0 || startedAt < lastGradeDoneAt) return;
    if (d && Array.isArray(d.results)) renderLiveResults(d.results, d.flags);
  } catch (e) {
  } finally {
    livePolling = false;
  }
}

function renderLiveFlags(flags) {
  const box = $('liveFlags');
  if (!box) return;
  if (!Array.isArray(flags) || !flags.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'block';
  box.innerHTML = '<strong>⚠️ Possible retakes</strong> — worth a look:' + flags.slice().reverse().map(f => `
    <div style="margin-top:8px;"><strong dir="auto">${esc(f.n)}</strong> started on what looks like the same phone as <strong dir="auto">${esc((Array.isArray(f.of) ? f.of : []).join(', '))}</strong>${f.ip ? ' (same network too)' : ''}${f.d ? ' · ' + esc(f.d) : ''}</div>`).join('');
}

function renderLiveResults(list, flags) {
  liveList = list;
  if (flags !== undefined) liveFlagsMem = flags;

  // Redraw only when something changed, so scroll positions inside the cards aren't reset every 3 seconds
  const sig = JSON.stringify([list, liveFlagsMem, liveViewOnly, !!liveTeacherKey()]);
  if (sig === liveSig) return;
  liveSig = sig;

  renderLiveFlags(liveFlagsMem);
  const grid = $('liveGrid');
  const status = $('liveStatus');
  if (!grid || !status) return;
  if (!list.length) {
    status.textContent = 'Waiting for students to finish… this page updates on its own.';
    grid.innerHTML = '';
    return;
  }
  const waiting = list.reduce((n, r) => n + (Array.isArray(r.b) ? r.b.filter(x => x.w && x.r === null).length : 0), 0);
  status.textContent = list.length + (list.length === 1 ? ' student has' : ' students have') + ' submitted so far. This page updates automatically.' +
    (waiting ? ' ✍️ ' + waiting + (waiting === 1 ? ' written answer is' : ' written answers are') + ' waiting for you to mark.' : '');
  grid.innerHTML = list.slice().reverse().map(miniResultCard).join('');
}

function miniResultCard(res) {
  const b = Array.isArray(res.b) ? res.b : [];
  const pending = b.filter(x => x.w && x.r === null).length;
  const pct = Math.round((res.s / res.t) * 100);
  const grade = pending ? 'So far' : gradeFor(pct);
  const canMark = !!res.sid && !liveViewOnly && !!liveTeacherKey();
  let time = '';
  try { time = res.ts ? new Date(res.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''; } catch (e) {}

  const rows = b.map((row, i) => `
    <div class="mini-row">
      <span dir="auto">Q${i + 1}: ${esc(row.q)}</span>
      ${row.r === null
        ? '<span class="pending-tag" style="margin-left:0;">⏳</span>'
        : `<span class="${row.r ? 'correct-tag' : 'wrong-tag'}">${row.r ? '✓' : '✗'}</span>`}
    </div>`).join('');

  // Written answers: the teacher reads each one and taps Correct or Wrong
  const written = b.map((row, i) => ({ row, i })).filter(x => x.row.w);
  const wrBox = written.length
    ? '<div class="wr-box"><div class="wr-title">✍️ Written answers</div>' + written.map(({ row, i }) => writtenItemHtml(res, row, i, canMark)).join('') + '</div>'
    : '';

  return `
    <div class="mini-card${pending ? ' needs-mark' : ''}">
      <div class="mini-name" dir="auto">${esc(res.n)}</div>
      <div class="mini-time">${time}</div>
      <div class="mini-score">${res.s}/${res.t}</div>
      <div class="mini-grade">${grade} · ${pct}%</div>
      ${pending ? `<div class="mini-pending">⏳ ${pending} to mark</div>` : ''}
      ${wrBox}
      <div class="mini-breakdown">${rows}</div>
    </div>`;
}

function writtenItemHtml(res, row, i, canMark) {
  const has = typeof row.a === 'string' && row.a !== '';
  const noAnswer = row.r === false && row.a === '';    // time ran out with nothing typed
  const answerHtml = has
    ? `<div class="wr-a" dir="auto">${esc(row.a)}</div>`
    : noAnswer
      ? '<div class="wr-a none">No answer</div>'
      : '<div class="wr-a none">Answer hidden (open Live Results from the page where you saved the quiz to mark it)</div>';

  let controls;
  if (noAnswer) {
    controls = '<div class="wr-state no">✗ Wrong — no answer</div>';
  } else if (canMark && has) {
    controls = `<div class="wr-btns">
      <button class="wr-btn ok ${row.r === true ? 'on' : ''}" onclick="gradeWritten('${esc(res.sid)}',${i},true)">✓ Correct</button>
      <button class="wr-btn no ${row.r === false ? 'on' : ''}" onclick="gradeWritten('${esc(res.sid)}',${i},false)">✗ Wrong</button>
    </div>`;
  } else {
    controls = row.r === true ? '<div class="wr-state ok">✓ Correct</div>'
      : row.r === false ? '<div class="wr-state no">✗ Wrong</div>'
      : '<div class="wr-state">⏳ Waiting for the teacher</div>';
  }
  return `<div class="wr-item"><div class="wr-q" dir="auto">Q${i + 1}: ${esc(row.q)}</div>${answerHtml}${controls}</div>`;
}

// Teacher taps Correct / Wrong. The card updates at once; the mark is then saved on the server
// (one at a time, so quick taps never overwrite each other). Tapping the same button again clears the mark.
function gradeWritten(sid, i, r) {
  const e = liveList.find(x => x.sid === sid);
  const row = e && e.b && e.b[i];
  if (!row || !row.w) return;
  const next = (row.r === r) ? null : r;
  row.r = next;
  e.s = e.b.filter(x => x.r === true).length;
  renderLiveResults(liveList);

  gradeBusy++;
  gradeQueue = gradeQueue.then(async () => {
    try {
      const resp = await apiPost('/grade', { id: liveQuizId, tk: liveTeacherKey(), sid, i, r: next });
      if (!resp.ok) throw new Error('rejected');
      showMsg('', 'liveMsg');
    } catch (err) {
      showMsg('Could not save that mark. Check your connection — the page will show what is really saved in a moment.', 'liveMsg');
    }
    gradeBusy--;
    lastGradeDoneAt = Date.now();
  });
}

// ── Who's in the test ──
function openRoom() {
  roomOpen = true;
  roomSig = '';
  $('liveMain').style.display = 'none';
  $('liveRoom').style.display = 'block';
  const sa = $('scrollArea');
  if (sa) sa.scrollTop = 0;
  showMsg('', 'roomMsg');
  pollRoom();
  if (!roomTickId) roomTickId = setInterval(tickRoom, 1000);
}

function closeRoom() {
  roomOpen = false;
  $('liveRoom').style.display = 'none';
  $('liveMain').style.display = 'block';
  if (roomTickId) { clearInterval(roomTickId); roomTickId = null; }
}

const NO_KEY_MSG = "This browser doesn't have the teacher key for this quiz. Open Live Results with the button on the page where you saved the quiz.";

async function pollRoom() {
  if (!liveQuizId) return;
  const status = $('roomStatus');
  const tk = liveTeacherKey();
  if (!tk) {
    if (status) status.textContent = "This browser doesn't have your teacher key. Open Live Results with the button on the page where you saved the quiz.";
    return;
  }
  try {
    const r = await apiPost('/live', { id: liveQuizId, tk }, 10000);
    if (r.status === 403) { if (status) status.textContent = NO_KEY_MSG; return; }
    if (!r.ok) return;
    const d = await r.json();
    roomOffset = (typeof d.now === 'number' ? d.now : Date.now()) - Date.now();   // server clock vs this device
    roomData = d;
    renderRoom();
  } catch (e) {}
}

function renderRoom() {
  const d = roomData;
  if (!d) return;
  const sig = JSON.stringify([d.items, d.roster, d.notStarted]);
  if (sig === roomSig) return;                     // nothing changed: leave the list (and any open confirm) alone
  roomSig = sig;

  const items = (Array.isArray(d.items) ? d.items : []).slice().sort((a, b) => ((a.d ? 1 : 0) - (b.d ? 1 : 0)) || (b.t - a.t));
  const inTest = items.filter(i => !i.d).length;
  const status = $('roomStatus');
  const list = $('roomList');
  if (!status || !list) return;

  status.textContent = items.length === 0
    ? 'Nobody has started yet. This page updates on its own.'
    : inTest + (inTest === 1 ? ' student is' : ' students are') + ' in the test right now. This page updates on its own.';

  const rows = items.map(i => `
    <div class="room-row">
      <div class="room-main">
        <div class="room-name" dir="auto">${esc(i.n)}</div>
        <div class="room-timer" data-t="${Number(i.t) || 0}" data-lim="${Number(i.lim) || 0}" data-d="${Number(i.d) || 0}"></div>
      </div>
      <button class="btn btn-outline room-btn" data-k="${esc(i.k)}" data-n="${esc(i.n)}" onclick="giveAnotherTry(this)">Give another try</button>
    </div>`).join('');

  let waiting = '';
  if (d.roster) {
    const ns = Array.isArray(d.notStarted) ? d.notStarted : [];
    waiting = ns.length
      ? `<div class="info-box" style="margin-top:16px;"><strong>Not started yet (${ns.length}):</strong> <span dir="auto">${ns.map(esc).join(', ')}</span></div>`
      : '<div class="info-box" style="margin-top:16px;">Everyone on your class list has started.</div>';
  }
  list.innerHTML = rows + waiting;
  tickRoom();
}

// Runs every second: updates each student's timer text without asking the server
function tickRoom() {
  const now = Date.now() + roomOffset;
  document.querySelectorAll('#roomList .room-timer').forEach(el => {
    const t = Number(el.dataset.t), lim = Number(el.dataset.lim), done = Number(el.dataset.d);
    let text, cls = '';
    if (done) {
      text = '✅ Finished' + (t ? ' · took ' + fmtClock(Math.max(0, Math.floor((done - t) / 1000))) : '');
      cls = 'ok';
    } else if (lim) {
      const left = Math.ceil(lim - (now - t) / 1000);
      if (left > 0) { text = '⏱ ' + fmtClock(left) + ' left'; cls = left <= 60 ? 'warn' : ''; }
      else { text = "⌛ Time's up — not submitted"; cls = 'warn'; }
    } else {
      text = '⏱ ' + fmtClock(Math.max(0, Math.floor((now - t) / 1000))) + ' in the test';
    }
    el.textContent = text;
    el.className = 'room-timer' + (cls ? ' ' + cls : '');
  });
}

async function giveAnotherTry(btn) {
  const k = btn.dataset.k, n = btn.dataset.n;
  if (!confirm('Let ' + n + ' take the quiz again?\n\nThey need to open the quiz link again. Any result they already sent stays on the Live Results page.')) return;
  btn.disabled = true;
  try {
    const r = await apiPost('/reset', { id: liveQuizId, tk: liveTeacherKey(), k });
    if (r.ok) {
      showMsg(n + ' can start again. Ask them to open the quiz link again.', 'roomMsg', true);
      pollRoom();
      return;
    }
    showMsg('Could not give another try (the server said no). Open Live Results from the page where you saved the quiz.', 'roomMsg');
  } catch (e) {
    showMsg('Could not reach the server. Try again.', 'roomMsg');
  }
  btn.disabled = false;
}


/* ── 14. REFRESH & PULL-TO-REFRESH ──────────────────────── */
// A teacher only has something to lose while the quiz being built has questions no link was made for yet.
// Students never do: their name, answers and timer are saved and come back.
function hasUnsavedQuiz() {
  try {
    return Array.isArray(questions) && questions.length > 0 && JSON.stringify(questions) !== savedQuestionsSig;
  } catch (e) { return false; }
}

// Asks once (only when there is something to lose). Returns true when it is fine to reload.
function okToRefresh() {
  return !hasUnsavedQuiz() || confirm("You'll lose your progress. Refresh anyway?");
}

function reloadNow() {
  leaveWarningOff = true;   // we already asked, so the browser must not ask a second time
  location.reload();
}

// Tapping the logo or "Quiz Builder" in the header
function refreshPage() {
  if (okToRefresh()) reloadNow();
}

// The browser's own "Leave site?" prompt for its refresh / back / closing the tab.
// It can only be shown, not reworded, and some phones (iPhone Safari) skip it.
window.addEventListener('beforeunload', function (e) {
  if (leaveWarningOff || !hasUnsavedQuiz()) return;
  e.preventDefault();
  e.returnValue = '';
});

// Pull down on the header to refresh (phones)
(function () {
  const TRIGGER = 90;
  let startY = null, pull = 0;

  function getPtr() {
    let p = $('ptr');
    if (!p) {
      p = document.createElement('div');
      p.id = 'ptr';
      p.textContent = '↻';
      document.body.appendChild(p);
    }
    return p;
  }

  function hidePtr() {
    const p = $('ptr');
    if (!p) return;
    p.classList.remove('spin');
    p.style.transition = 'transform 0.2s, opacity 0.2s';
    p.style.opacity = '0';
    p.style.transform = 'translateY(-60px)';
    p.style.borderColor = '';
  }

  document.addEventListener('touchstart', function (e) {
    const onHeader = e.target && e.target.closest && e.target.closest('.site-header');
    if (!onHeader || e.touches.length !== 1) { startY = null; return; }
    startY = e.touches[0].clientY;
    pull = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { pull = 0; hidePtr(); return; }
    pull = Math.min(dy * 0.6, 130);
    const p = getPtr();
    p.classList.remove('spin');
    p.style.transition = 'none';
    p.style.opacity = String(Math.min(1, pull / 40));
    p.style.transform = 'translateY(' + (pull - 60) + 'px) rotate(' + Math.round(pull * 3) + 'deg)';
    p.style.borderColor = pull >= TRIGGER ? 'var(--correct)' : '';
  }, { passive: true });

  function release(cancelled) {
    if (startY === null) return;
    startY = null;
    if (cancelled || pull < TRIGGER) { pull = 0; hidePtr(); return; }
    pull = 0;
    if (!okToRefresh()) { hidePtr(); return; }
    const p = getPtr();
    p.style.transition = 'none';
    p.style.opacity = '1';
    p.style.borderColor = '';
    p.classList.add('spin');
    setTimeout(reloadNow, 250);
  }

  document.addEventListener('touchend', function () { release(false); }, { passive: true });
  document.addEventListener('touchcancel', function () { release(true); }, { passive: true });
})();


/* ── 15. START-UP ───────────────────────────────────────── */
document.body.insertAdjacentHTML('afterbegin', BODY_HTML);
initTheme();

// Keep the phone's Back button from leaving the quiz
try {
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    try { history.pushState(null, '', location.href); } catch (e) {}
  });
} catch (e) {}

// Teacher tab in the background: catch up as soon as it comes back
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && liveQuizId) pollLiveResults();
});

(async () => {
  // 1. Live Results link: #live=<id> or #live=<id>.<teacher key>
  const liveMatch = location.hash.match(/^#live=([a-z0-9]{4,20})(?:\.([a-f0-9]{32}))?$/i);
  if (liveMatch) {
    if (liveMatch[2]) {
      liveTkMem = liveMatch[2].toLowerCase();
      lsSet('qb_tk:' + liveMatch[1], liveTkMem);
      try { history.replaceState(null, '', location.pathname + location.search + '#live=' + liveMatch[1]); } catch (e) {}
    }
    startLiveResults(liveMatch[1]);
    return;
  }

  // 2. A student link (or a quiz saved inside this page). No quiz = the home screen stays.
  const shared = await loadSharedQuiz();
  if (!shared) return;

  quizData = shared.quiz.questions;
  quizId = shared.quiz.id || ('h' + hashStr(JSON.stringify(shared.quiz.questions)));
  quizTime = shared.quiz.t || 0;
  quizHideFlash = !!shared.quiz.hf;
  quizShuffle = shared.quiz.sh !== false;
  initQueue();
  show('taker');

  // Continue where this device left off, unless the teacher gave this student another try
  let saved = loadProgress();
  if (saved && saved.k === 1 && await wasReset(saved.n)) {
    lsDel(progressKey());
    saved = null;
  }
  if (saved) restoreAttempt(saved); else renderTakerName();

  if (shared.source === 'page') detectTeacher();
})();
</script>
